name: Verify Revenue Lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript
        run: node --check dashboard/app.js
      - name: Validate public data
        run: python scripts/validate_public_data.py

